[package]
name = "ruggie-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
citro3d-sys = { git = "https://github.com/rust3ds/citro3d-rs.git", package = "citro3d-sys" }
citro2d-sys = { git = "https://git.sr.ht/~sheepy/citro2d-rs", package = "citro2d-sys" }
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs", features = ["romfs"] }
ctru-sys = { git = "https://github.com/rust3ds/ctru-rs" }

thiserror = "2.0.21"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dev-dependencies]
test-runner = { path = "dependencies/test-runner" }